name: Repair Historical Prices

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      reconcile:
        description: Discover missing and provisional closed-day targets before repair
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: yearn-prices-warmup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Load app secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_APP_IDENTITY_ID }}
          doppler-project: yearn-price
          doppler-config: warmup
          inject-env-vars: true
      - name: Reconcile historical repair targets
        if: github.event.schedule == '30 0 * * *' || (github.event_name == 'workflow_dispatch' && inputs.reconcile)
        run: bun run repair:historical --reconcile --write
      - name: Repair due targets
        run: bun run repair:historical --write --limit 100 --budget-seconds 600
