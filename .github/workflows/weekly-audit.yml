name: Weekly Price Audit

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: yearn-prices-warmup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Load app secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_APP_IDENTITY_ID }}
          doppler-project: yearn-price
          doppler-config: warmup
          inject-env-vars: true
      - name: Audit, backfill, re-audit
        run: bun run audit:prices:backfill
      - name: Heartbeat
        if: success()
        run: |
          if [ -z "$UPTIME_URL" ]; then echo "::warning::UPTIME_URL not set, skipping heartbeat"; exit 0; fi
          curl -fsS -m 10 --retry 3 -X POST "$UPTIME_URL"
      - name: Failure heartbeat
        if: failure()
        run: |
          if [ -z "$UPTIME_URL" ]; then echo "::warning::UPTIME_URL not set, skipping heartbeat"; exit 0; fi
          curl -fsS -m 10 --retry 3 -X POST "$UPTIME_URL/fail"
