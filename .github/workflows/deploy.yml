name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - uses: 1Password/install-cli-action@v1
      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DATABASE_URL: op://webops-prod/yearn-price/DATABASE_URL
          API_KEY_KONG: op://webops-prod/yearn-price/API_KEY_KONG
          API_KEY_FRONTEND: op://webops-prod/yearn-price/API_KEY_FRONTEND
          ENSO_API_KEY: op://webops-prod/yearn-price/ENSO_API_KEY
          CLOUDFLARE_API_TOKEN: op://webops-prod/yearn-price/CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID: op://webops-prod/yearn-price/CLOUDFLARE_ACCOUNT_ID
          RPC_URL_1: op://webops-prod/yearn-price/RPC_URL_1
          RPC_URL_10: op://webops-prod/yearn-price/RPC_URL_10
          RPC_URL_100: op://webops-prod/yearn-price/RPC_URL_100
          RPC_URL_137: op://webops-prod/yearn-price/RPC_URL_137
          RPC_URL_146: op://webops-prod/yearn-price/RPC_URL_146
          RPC_URL_250: op://webops-prod/yearn-price/RPC_URL_250
          RPC_URL_8453: op://webops-prod/yearn-price/RPC_URL_8453
          RPC_URL_42161: op://webops-prod/yearn-price/RPC_URL_42161
          RPC_URL_80094: op://webops-prod/yearn-price/RPC_URL_80094
          RPC_URL_747474: op://webops-prod/yearn-price/RPC_URL_747474
      - name: Upload secrets to Cloudflare
        run: |
          jq -n '{
            DATABASE_URL: env.DATABASE_URL,
            API_KEY_KONG: env.API_KEY_KONG,
            API_KEY_FRONTEND: env.API_KEY_FRONTEND,
            ENSO_API_KEY: env.ENSO_API_KEY,
            RPC_URL_1: env.RPC_URL_1,
            RPC_URL_10: env.RPC_URL_10,
            RPC_URL_100: env.RPC_URL_100,
            RPC_URL_137: env.RPC_URL_137,
            RPC_URL_146: env.RPC_URL_146,
            RPC_URL_250: env.RPC_URL_250,
            RPC_URL_8453: env.RPC_URL_8453,
            RPC_URL_42161: env.RPC_URL_42161,
            RPC_URL_80094: env.RPC_URL_80094,
            RPC_URL_747474: env.RPC_URL_747474
          }' | bunx wrangler secret bulk
      - name: Run migrations
        run: bun run migrate
      - name: Warm price cache
        run: bun run warmup
      - run: bun run deploy
