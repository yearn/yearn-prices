name: Deploy Worker

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Load secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.IDENTITY_ID }}
          doppler-project: yearn-price
          doppler-config: prd
      - name: Run migrations
        run: bun run migrate
      - name: Warm price cache
        run: bun run warmup

  deploy:
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: yearn/yearn-gha/.github/workflows/cloudflare-deploy.yml@ba1d1e2800e9a0dfd9d47257dc458fbbd4ea6208
    with:
      identity-id: ${{ vars.DOPPLER_PRODUCTION_IDENTITY_ID }}
